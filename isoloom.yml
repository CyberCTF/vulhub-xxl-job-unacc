# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XXL-JOB executor unauthenticated access (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's xxl-job/unacc, vendored in app/: the published images
# vulhub/xxl-job:2.2.0-admin and -executor, and mysql:5.7 with the password of Vulhub's compose file baked in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-xxl-job-unacc

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.250.0/24, internet: false}

machines:
  db:
    networks: {lab: 30}
    resources: {cpus: 1, memory_mb: 512}
    ports:
      mysql:
        port: 3306
    app:
      build: build/db
  admin:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [db]
    ports:
      web:
        port: 8080
        protocol: http
        publish: true
    app:
      image: vulhub/xxl-job:2.2.0-admin
  executor:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [admin]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      executor:
        port: 9999
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      image: vulhub/xxl-job:2.2.0-executor

checks:
  - name: the admin console answers
    http: http://admin:8080/xxl-job-admin/toLogin
    wait: 300
  - name: the executor API answers
    script: checks/executor.sh
    wait: 180

message: |
  XXL-JOB 2.2.0: the admin console answers at {{ machines.admin.ports.web.url }}xxl-job-admin and the executor at
  {{ machines.executor.ports.executor.url }}. Does the executor ask who sends it jobs?
