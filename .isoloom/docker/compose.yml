    - /isoloom/init/flag.sh
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - executor-ctf:/ctf
    network_mode: service:executor
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    depends_on:
      executor:
        condition: service_healthy
      executor-routes:
        condition: service_healthy
    restart: no
    labels:
