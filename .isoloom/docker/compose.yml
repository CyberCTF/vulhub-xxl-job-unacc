name: vulhub-xxl-job-unacc
services:
  db:
    build:
      context: ../../build/db
      labels:
        isoloom.managed: 'true'
        isoloom.environment: vulhub-xxl-job-unacc
    image: isoloom/vulhub-xxl-job-unacc-db
    platform: linux/amd64
    hostname: db
    networks:
      lab:
        ipv4_address: 10.60.250.30
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mysql: tcp:3306
      isoloom.managed: 'true'
      isoloom.environment: vulhub-xxl-job-unacc
    restart: unless-stopped
  db-routes:
    image: alpine:3.20
    network_mode: service:db
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-xxl-job-unacc
  admin:
    image: vulhub/xxl-job:2.2.0-admin
    platform: linux/amd64
    hostname: admin
    networks:
      lab:
        ipv4_address: 10.60.250.20
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8080}:8080
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8080
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:8080
      isoloom.managed: 'true'
      isoloom.environment: vulhub-xxl-job-unacc
    restart: unless-stopped
  admin-routes:
    image: alpine:3.20
    network_mode: service:admin
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      admin:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-xxl-job-unacc
  executor:
    image: vulhub/xxl-job:2.2.0-executor
    platform: linux/amd64
    hostname: executor
    networks:
      lab:
        ipv4_address: 10.60.250.10
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+9999}:9999
    volumes:
    - executor-ctf:/ctf
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 9999
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      admin:
        condition: service_healthy
      admin-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.executor: http:9999
      isoloom.managed: 'true'
      isoloom.environment: vulhub-xxl-job-unacc
    restart: unless-stopped
  executor-routes:
    image: alpine:3.20
